# Install to /etc/nginx/sites-available/4h, then:
#   sudo ln -sf /etc/nginx/sites-available/4h /etc/nginx/sites-enabled/4h
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /var/www/4h;
    index index.html;

    access_log off;

    # NOTE: no `$uri/` in try_files, deliberately. public/2026/ is a real directory
    # with no index.html in it, so `try_files $uri $uri/ /index.html` would resolve
    # the /2026 route to that directory and return 403 instead of falling through
    # to the SPA. Matching files still win; everything else lands on index.html.
    location / {
        try_files $uri /index.html;
    }

    # index.html must never be cached. It is the only unfingerprinted file that names
    # the fingerprinted ones, so a stale copy pins the whole site to the previous
    # build — you deploy an update and the kiosk keeps showing the old site. Without
    # an explicit header nginx sends none, and the browser applies heuristic caching
    # off Last-Modified.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Fetched at runtime by src/offline/assets.js to resolve ?v= content hashes. A
    # stale copy hands out URLs for assets that no longer exist.
    location = /offline-manifest.json {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Packaged Scratch games are real documents loaded into iframes. An iframe load
    # is a navigation request — without this they would each be served index.html
    # and render the app recursively. Same reasoning as the service worker
    # navigation denylist in src/sw.js.
    location /games/ {
        try_files $uri =404;
    }

    # Vite fingerprints these, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        font/woff2                            woff2;
        video/mp4                             mp4;
        model/stl                             stl;
        text/plain                            txt;
        # Without this the types block above (which replaces nginx's defaults)
        # falls through to default_type and the browser gets a PDF labelled
        # text/plain — the embedded viewer shows raw bytes instead of the page.
        application/pdf                       pdf;
    }
}
