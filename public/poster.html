<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4H Computer Project Showcase — Print Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  /*
   * One printed sheet whose only job is to get a visitor to scan the code.
   * Everything is sized in inches so it lays out identically whether or not the
   * webfonts load — printed from a machine with no connection it falls back to
   * system fonts and the page still comes out right.
   */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep:  #0f3322;
    --green-rich:  #1d5c3a;
    --green:       #339966;
    --green-mid:   #277a52;
    --green-pale:  #dcf0e5;
    --green-bg:    #f4f9f6;
    --text:        #142b1e;
    --text-muted:  #4a6e57;
  }

  html, body {
    font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    background: #e5e7eb;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* On screen this previews as a letter sheet; in print it becomes the page. */
  .poster {
    width: 8.5in;
    height: 11in;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,.18);
    border-radius: 6px;
    padding: 0.9in 0.85in;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.5in;
  }

  /* ── TITLE ───────────────────────────────────────────────── */
  .title {
    font-family: 'Syne', system-ui, sans-serif;
    font-weight: 800;
    font-size: 0.46in;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--green-deep);
  }
  .title em {
    font-style: normal;
    color: var(--green);
  }

  .subtitle {
    margin-top: 0.13in;
    font-size: 0.16in;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ── QR ──────────────────────────────────────────────────── */
  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.28in;
    background: var(--green-bg);
    border: 2px solid rgba(51,153,102,.2);
    border-radius: 16px;
    padding: 0.42in 0.5in 0.46in;
  }

  .qr-img-wrap {
    width: 3.2in;
    height: 3.2in;
    padding: 0.12in;
    background: #fff;
    border-radius: 10px;
    border: 1.5px solid rgba(51,153,102,.25);
  }
  .qr-img-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    /* The source is a modest PNG blown up to 3.2in — keep the module edges hard
       instead of letting the browser smooth them into an unscannable blur. */
    image-rendering: pixelated;
  }

  .qr-headline {
    font-family: 'Syne', system-ui, sans-serif;
    font-weight: 800;
    font-size: 0.32in;
    line-height: 1.15;
    color: var(--green-deep);
    /* Kept on one line — the block widens to fit it rather than the headline
       wrapping to two lines under the code. */
    white-space: nowrap;
  }

  /* Printed as text as well as encoded, so a visitor whose camera will not
     cooperate can still type it in. */
  .qr-url {
    margin-top: 0.09in;
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size: 0.185in;
    font-weight: 500;
    color: var(--green-mid);
    word-break: break-all;
  }

  /* ── STEPS ───────────────────────────────────────────────── */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 0.13in;
    text-align: left;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 0.15in;
    font-size: 0.17in;
    color: var(--text);
    line-height: 1.4;
  }
  .step-num {
    flex-shrink: 0;
    width: 0.28in;
    height: 0.28in;
    background: var(--green);
    color: #fff;
    border-radius: 50%;
    font-family: 'Syne', system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.15in;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── PRINT ───────────────────────────────────────────────── */
  @media print {
    /* Half an inch of margin rather than none: with no full-bleed element left
       on the sheet, a zero margin only risks a printer's unprintable edge
       clipping the content. */
    @page { size: letter portrait; margin: 0.5in; }

    html, body {
      background: white;
      padding: 0;
      display: block;
    }

    .poster {
      width: 100%;
      height: auto;
      min-height: 10in;   /* letter's 11in minus the 0.5in @page margins */
      padding: 0;
      box-shadow: none;
      border-radius: 0;
      /* Chrome drops background colours unless the user ticks "Background
         graphics" — without this the greens print as white. */
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .qr-block { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="poster">

  <div>
    <div class="title">Computer Project <em>Showcase</em></div>
    <div class="subtitle">Port Hood Island View 4&#8209;H &middot; 2026</div>
  </div>

  <div class="qr-block">
    <div class="qr-img-wrap">
      <img src="qr.png" alt="QR code linking to 4h-showcase.frankschmidt.ca">
    </div>
    <div>
      <div class="qr-headline">Scan to open the website</div>
      <div class="qr-url">4h-showcase.frankschmidt.ca</div>
    </div>
  </div>

  <div class="steps">
    <div class="step"><div class="step-num">1</div><span>Scan the QR code with your camera</span></div>
    <div class="step"><div class="step-num">2</div><span>Tap the link to open the site</span></div>
    <div class="step"><div class="step-num">3</div><span>Browse the games and programs</span></div>
  </div>

</div>
</body>
</html>
